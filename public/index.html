<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mimurarias</title>
  <meta name="description" content="Mimurarias.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎮</text></svg>">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="home">

  <main class="home-stage">
    <div class="home-panel">
      <h1 class="home-wordart">MIMURARIAS</h1>
      <p class="home-tag">> press start <</p>

      <button id="start-btn" class="start-btn" type="button">START</button>

      <p id="start-msg" class="start-msg" role="status" aria-live="polite" hidden>
        Obrigado por pressionar START! 💜
      </p>

      <p class="home-counter">
        START pressed: <span id="counter-value">—</span>
      </p>
    </div>

    <div class="home-ground" aria-hidden="true"></div>
  </main>

  <script>
    const btn = document.getElementById('start-btn');
    const msg = document.getElementById('start-msg');
    const counter = document.getElementById('counter-value');

    const LOCAL_KEY = 'mimurarias-starts';
    const localCount = () => Number(localStorage.getItem(LOCAL_KEY) || 0);

    function showCount(n) {
      counter.textContent = String(n).padStart(4, '0');
    }

    async function readCount() {
      try {
        const res = await fetch('/api/count');
        if (!res.ok) throw new Error(res.status);
        const data = await res.json();
        showCount(data.count);
      } catch {
        showCount(localCount());
      }
    }

    async function pressStart() {
      msg.hidden = false;
      btn.disabled = true;

      try {
        const res = await fetch('/api/count', { method: 'POST' });
        if (!res.ok) throw new Error(res.status);
        const data = await res.json();
        showCount(data.count);
      } catch {
        const next = localCount() + 1;
        localStorage.setItem(LOCAL_KEY, String(next));
        showCount(next);
      } finally {
        btn.disabled = false;
      }
    }

    btn.addEventListener('click', pressStart);
    readCount();
  </script>
</body>
</html>
