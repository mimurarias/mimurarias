<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mimurarias</title>
  <meta name="description" content="Mimurarias.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎮</text></svg>">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="home">

  <main class="home-stage">
    <div class="home-panel">
      <h1 class="home-wordart">MIMURARIAS</h1>
      <p class="home-tag">> press start <</p>

      <button id="start-btn" class="start-btn" type="button">START</button>

      <p id="start-msg" class="start-msg" role="status" aria-live="polite" hidden>
        Obrigado por pressionar START! 💜
      </p>

      <p class="home-counter">
        Visitas: <span id="stat-visits">—</span> | STARTs: <span id="stat-clicks">—</span>
      </p>
    </div>

    <div class="home-ground" aria-hidden="true"></div>
  </main>

  <script>
    const btn = document.getElementById('start-btn');
    const msg = document.getElementById('start-msg');
    const visitsEl = document.getElementById('stat-visits');
    const clicksEl = document.getElementById('stat-clicks');

    const pad = (n) => String(n).padStart(4, '0');

    // Only the global totals are shown; values never come from this page.
    function show(data) {
      if (!data || typeof data.visits !== 'number' || typeof data.clicks !== 'number') return;
      visitsEl.textContent = pad(data.visits);
      clicksEl.textContent = pad(data.clicks);
    }

    async function count(action) {
      const res = await fetch('/api/count', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ action }),
      });
      if (!res.ok) throw new Error(res.status);
      return res.json();
    }

    let busy = false;
    btn.addEventListener('click', async () => {
      if (busy) return;
      busy = true;
      btn.disabled = true;
      msg.hidden = false;

      try {
        show(await count('click'));
      } catch {
        // Contador indisponível: mantém o último valor válido.
      } finally {
        btn.disabled = false;
        busy = false;
      }
    });

    // Uma conexão por carregamento da homepage.
    count('visit').then(show).catch(() => {});
  </script>
</body>
</html>
